    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Lan/Lan.list

# AI 上游列表里过宽的第三方域名，过滤掉，避免 Stripe/Auth0/Sentry 等
# 共享服务的流量被带进 AI 组。清空则完全照搬上游。
ai_blocklist:
  - auth0.com
  - stripe.com
  - algolia.net
  - segment.io
  - sentry.io
  - intercom.io
  - intercomcdn.com
  - launchdarkly.com
  - identrust.com
  - observeit.net
  - featuregates.org
  - api.statsig.com
  - events.statsigapi.net
  - static.cloudflareinsights.com
  - browser-intake-datadoghq.com
  - cdn.usefathom.com

# BM7 GlobalMedia 里有 DOMAIN-KEYWORD,anthropic / claude，
# 不跳过会和 AI 组冲突，香港/新加坡的 Streaming 默认直连会拖累 Claude。
streaming_keyword_blocklist:
  - anthropic
  - claude

# Apple AI 上游列表里范围过大、会影响非 Siri 服务的条目。
# 代码还会跳过所有 DOMAIN-KEYWORD（例如 siri），只保留 DOMAIN/DOMAIN-SUFFIX。
siri_blocklist:
  - ls.apple.com
  - apps.mzstatic.com
  - gateway.icloud.com
  - wps.apple.com

# Apple 统一走 Apple 组；大陆默认 PROXY，香港/新加坡默认 DIRECT。
# push.apple.com 在 apple.com 下面，跟随 Apple 组，不单独写直连规则。
apple_suffixes:
  - apple.com
  - icloud.com
  - mzstatic.com
  - apple-dns.net
  - aaplimg.com
  - cdn-apple.com
  - apple-mapkit.com
  - icloud-content.com
  - me.com
  - mac.com
  - apple-cloudkit.com
  - apple.com.cn
  - apple.news

# Google 统一按 profile 的 google_policy 处理：
# 大陆 PROXY，香港/新加坡 DIRECT。
# google 这个 TLD 覆盖 adtrafficquality.google，gstatic.com 覆盖 www.gstatic.com。
google_suffixes:
  - google
  - google.com
  - google.com.hk
  - googleapis.com
  - gstatic.com
  - googleusercontent.com
  - gmail.com
  - googlevideo.com
  - ytimg.com
  - ggpht.com

# GitHub 域名：大陆走代理，香港/新加坡直连。
# githubusercontent.com 覆盖 raw./user-images./avatars./objects. 等图片资源。
github_suffixes:
  - github.com
  - githubusercontent.com
  - githubassets.com
  - github.io

# 冲突优先级，从高到低：
# 同一个域名/IP 同时出现在多个类别时，保留高优先级规则，删除低优先级规则。
# 顺序可以按需调整；未知名称会被忽略，缺失类别会追加到末尾。
priority:
  - ads
  - lan
  - ai
  - siri
  - streaming
  - apple
  - google
  - github
  - china

profiles:
  cn:
    output: sr_cn.conf
    title: 中国大陆
    dns: https://dns.alidns.com/dns-query, https://doh.pub/dns-query
    google_policy: PROXY
    github_policy: PROXY
    final: PROXY
    groups:
      AI: select,PROXY,DIRECT
      SiriAI: select,PROXY,DIRECT
      Streaming: select,PROXY,DIRECT
      Apple: select,PROXY,DIRECT
      BackCN: select,DIRECT,PROXY
  hk:
    output: sr_hk.conf
    title: 中国香港
    dns: https://cloudflare-dns.com/dns-query, https://dns.google/dns-query
    google_policy: DIRECT
    github_policy: DIRECT
    final: DIRECT
    groups:
      AI: select,PROXY,DIRECT
      SiriAI: select,PROXY,DIRECT
      Streaming: select,DIRECT,PROXY
      Apple: select,DIRECT,PROXY
      BackCN: select,DIRECT,PROXY
  sg:
    output: sr_sg.conf
    title: 新加坡 / 境外
    dns: https://cloudflare-dns.com/dns-query, https://dns.google/dns-query
    google_policy: DIRECT
    github_policy: DIRECT
    final: DIRECT
    groups:
      AI: select,DIRECT,PROXY
      SiriAI: select,DIRECT,PROXY
      Streaming: select,DIRECT,PROXY
      Apple: select,DIRECT,PROXY
      BackCN: select,DIRECT,PROXY
