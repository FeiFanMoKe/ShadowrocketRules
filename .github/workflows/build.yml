name: Build Shadowrocket configs

on:
  schedule:
    # 每天北京时间 07:00（UTC 23:00）
    - cron: "0 23 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "state/**"
  workflow_dispatch:
    inputs:
      ad_mode:
        description: "Ad rules mode"
        required: true
        default: "lite"
        type: choice
        options:
          - lite
          - full

permissions:
  contents: write
  issues: write

concurrency:
  group: build-shadowrocket-configs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Cache fetched rule sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: factory/cache
          key: rule-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            rule-cache-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build configs
        run: python factory/build.py --ad-mode "${{ github.event.inputs.ad_mode || 'lite' }}"

      - name: Preflight check
        run: python factory/preflight.py

      - name: Commit source state
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain state/sources.json)" ]; then
            echo "source state unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/sources.json
          git commit -m "Update source state [skip ci]"
          git push origin HEAD:main

      - name: Prepare release folder
        run: |
          mkdir -p dist
          cp sr_cn.conf sr_hk.conf sr_sg.conf README.md dist/
          touch dist/.nojekyll

      - name: Deploy to release branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: ./dist
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Nightly build"

      - name: Notify failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build failed: ${context.workflow} #${context.runNumber}`,
              body: [
                `Workflow failed: ${runUrl}`,
                `Commit: ${context.sha}`,
                `Ref: ${context.ref}`,
              ].join("\n"),
            });
