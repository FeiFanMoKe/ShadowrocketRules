name: Build Shadowrocket configs

on:
  schedule:
    # 每天北京时间 07:00（UTC 23:00）
    - cron: "0 23 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "state/**"
  workflow_dispatch:
    inputs:
      ad_mode:
        description: "Ad rules mode"
        required: true
        default: "lite"
        type: choice
        options:
          - lite
          - full

permissions:
  contents: write

concurrency:
  group: build-shadowrocket-configs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache fetched rule sources
        uses: actions/cache@v4
        with:
          path: factory/cache
          key: rule-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            rule-cache-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build configs
        run: python factory/build.py --ad-mode "${{ github.event.inputs.ad_mode || 'lite' }}"

      - name: Preflight check
        run: python factory/preflight.py

      - name: Commit source state
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain state/sources.json)" ]; then
            echo "source state unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/sources.json
          git commit -m "Update source state [skip ci]"
          git push origin HEAD:main

      - name: Prepare release folder
        run: |
          mkdir -p dist
          cp sr_cn.conf sr_hk.conf sr_sg.conf README.md dist/
          touch dist/.nojekyll

      - name: Deploy to release branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: ./dist
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Nightly build"
